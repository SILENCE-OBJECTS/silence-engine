name: ci-locked
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: lockfile required
        run: test -f Cargo.lock
      - run: cargo test --locked --lib
